<svg xmlns="http://www.w3.org/2000/svg" width="420" height="490" viewBox="0 0 420 490" role="img" aria-labelledby="title desc"><title id="title">목적지를 두 번 고르는 동선 줄이기</title><desc id="desc">관찰한 흐름: 첫 검색 화면 진입 → 목적지 선택 화면 재진입 → 일정·인원 설정. 개선 제안: 해외 숙소 예약 진입 → 목적지 한 번 선택 → 일정·인원 설정</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text text-anchor="middle" x="112" y="28" font-size="17" fill="#706978"><tspan x="112" dy="0">관찰한 흐름</tspan></text><rect x="20" y="80" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="128" font-size="20" fill="#393344"><tspan x="112" dy="0">첫 검색 화면</tspan><tspan x="112" dy="28">진입</tspan></text><path d="M112 196v17m-5-5 5 5 5-5" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="217" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="265" font-size="20" fill="#393344"><tspan x="112" dy="0">목적지 선택 화면</tspan><tspan x="112" dy="28">재진입</tspan></text><path d="M112 333v17m-5-5 5 5 5-5" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="354" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="416" font-size="20" fill="#393344"><tspan x="112" dy="0">일정·인원 설정</tspan></text><text text-anchor="middle" x="308" y="28" font-size="17" fill="#7952a7"><tspan x="308" dy="0">개선 제안</tspan></text><rect x="216" y="80" width="184" height="108" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="308" y="128" font-size="20" fill="#393344"><tspan x="308" dy="0">해외 숙소 예약</tspan><tspan x="308" dy="28">진입</tspan></text><path d="M308 196v17m-5-5 5 5 5-5" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="216" y="217" width="184" height="108" rx="14" fill="#f4effb" st