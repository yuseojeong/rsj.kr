<svg xmlns="http://www.w3.org/2000/svg" width="420" height="490" viewBox="0 0 420 490" role="img" aria-labelledby="title desc"><title id="title">인원과 요청사항을 한 단계로 묶는 제안</title><desc id="desc">관찰한 주요 단계: 방문 인원 선택 → 요청사항 별도 입력 → 신청 후 대기 확인. 개선 제안: 인원·요청사항 함께 입력 → 신청 전 주의사항 확인 → 등록 후 대기 확인</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text text-anchor="middle" x="112" y="28" font-size="17" fill="#706978"><tspan x="112" dy="0">관찰한 주요 단계</tspan></text><rect x="20" y="80" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="142" font-size="20" fill="#393344"><tspan x="112" dy="0">방문 인원 선택</tspan></text><path d="M112 196v17m-5-5 5 5 5-5" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="217" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="265" font-size="20" fill="#393344"><tspan x="112" dy="0">요청사항 별도</tspan><tspan x="112" dy="28">입력</tspan></text><path d="M112 333v17m-5-5 5 5 5-5" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="354" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="402" font-size="20" fill="#393344"><tspan x="112" dy="0">신청 후 대기</tspan><tspan x="112" dy="28">확인</tspan></text><text text-anchor="middle" x="308" y="28" font-size="17" fill="#7952a7"><tspan x="308" dy="0">개선 제안</tspan></text><rect x="216" y="80" width="184" height="108" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="308" y="128" font-size="20" fill="#393344"><tspan x="308" dy="0">인원·요청사항</tspan><tspan x="308" dy="28">함께 입력</tspan></text><path d="M308 196v17m-5-5 5 5 5-5" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="216" y="217" width="184" height="108" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="308" y="265" font-size="20" fill="#393344"><tspan x="308" dy="0">신청 전 주의사항</tspan><tspan x="308" dy="28">확인</tspan></text><path d="M308 333v17m-5-5 5 5 5-5" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="216" y="354" width="184" height="108" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="308" y="402" font-size="20" fill="#393344"><tspan x="308" dy="0">등록 후 대기</tspan><tspan x="308" dy="28">확인</tspan></text></g></svg>
