<svg xmlns="http://www.w3.org/2000/svg" width="420" height="490" viewBox="0 0 420 490" role="img" aria-labelledby="title desc"><title id="title">커뮤니티 진입점을 앞으로 옮기는 제안</title><desc id="desc">관찰한 흐름: 홈 진입 → 메뉴를 넘겨 찾기 → 톡라운지 진입. 개선 제안: 홈 진입 → 주요 메뉴에 톡라운지 → 바로 글 탐색</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text text-anchor="middle" x="112" y="28" font-size="17" fill="#706978"><tspan x="112" dy="0">관찰한 흐름</tspan></text><rect x="20" y="80" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="142" font-size="20" fill="#393344"><tspan x="112" dy="0">홈 진입</tspan></text><path d="M112 196v17m-5-5 5 5 5-5" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="217" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="279" font-size="20" fill="#393344"><tspan x="112" dy="0">메뉴를 넘겨 찾기</tspan></text><path d="M112 333v17m-5-5 5 5 5-5" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="354" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="416" font-size="20" fill="#393344"><tspan x="112" dy="0">톡라운지 진입</tspan></text><text text-anchor="middle" x="308" y="28" font-size="17" fill="#7952a7"><tspan x="308" dy="0">개선 제안</tspan></text><rect x="216" y="80" width="184" height="108" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="308" y="142" font-size="20" fill="#393344"><tspan x="308" dy="0">홈 진입</tspan></text><path d="M308 196v17m-5-5 5 5 5-5" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="216" y="217" width="184" height="108" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="308" y="265" font-size="20" fill="#393344"><tspan x="308" dy="0">주요 메뉴에</tspan><tspan x="308" dy="28">톡라운지</tspan></text><path d="M308 333v17m-5-5 5 5 5-5" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="216" y="354" width="184" height="108" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="308" y="416" font-size="20" fill="#393344"><tspan x="308" dy="0">바로 글 탐색</tspan></text></g></svg>
