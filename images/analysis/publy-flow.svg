<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">막힌 가입 안내를 다음 행동으로 연결</title><desc id="desc">관찰한 불편: 앱에서 콘텐츠 선택 → 멤버십 가입 불가 안내 → 다음 경로 직접 찾기. 개선 제안: 이용 가능한 혜택 안내 → 웹 가입 바로가기 → 가입 후 콘텐츠 이용</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="25" y="30" font-size="19" font-weight="600" fill="#706978">관찰한 불편</text><rect x="24" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="170" y="110" font-size="23" fill="#393344"><tspan x="170" dy="0">앱에서 콘텐츠 선택</tspan></text><path d="M325 102h20m-6-6 6 6-6 6" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="354" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="500" y="110" font-size="23" fill="#393344"><tspan x="500" dy="0">멤버십 가입 불가 안내</tspan></text><path d="M655 102h20m-6-6 6 6-6 6" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="684" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="830" y="110" font-size="23" fill="#393344"><tspan x="830" dy="0">다음 경로 직접 찾기</tspan></text><text x="25" y="195" font-size="19" font-weight="600" fill="#7952a7">개선 제안</text><rect x="24" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="170" y="275" font-size="23" fill="#393344"><tspan x="170" dy="0">이용 가능한 혜택 안내</tspan></text><path d="M325 267h20m-6-6 6 6-6 6" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="354" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="500" y="275" font-size="23" fill="#393344"><tspan x="500" dy="0">웹 가입 바로가기</tspan></text><path d="M655 267h20m-6-6 6 6-6 6" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="684" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="830" y="275" font-size="23" fill="#393344"><tspan x="830" dy="0">가입 후 콘텐츠 이용</tspan></text></g></svg>
