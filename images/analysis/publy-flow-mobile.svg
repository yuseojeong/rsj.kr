<svg xmlns="http://www.w3.org/2000/svg" width="420" height="490" viewBox="0 0 420 490" role="img" aria-labelledby="title desc"><title id="title">막힌 가입 안내를 다음 행동으로 연결</title><desc id="desc">관찰한 불편: 앱에서 콘텐츠 선택 → 멤버십 가입 불가 안내 → 다음 경로 직접 찾기. 개선 제안: 이용 가능한 혜택 안내 → 웹 가입 바로가기 → 가입 후 콘텐츠 이용</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text text-anchor="middle" x="112" y="28" font-size="17" fill="#706978"><tspan x="112" dy="0">관찰한 불편</tspan></text><rect x="20" y="80" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="128" font-size="20" fill="#393344"><tspan x="112" dy="0">앱에서 콘텐츠</tspan><tspan x="112" dy="28">선택</tspan></text><path d="M112 196v17m-5-5 5 5 5-5" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="217" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="265" font-size="20" fill="#393344"><tspan x="112" dy="0">멤버십 가입 불가</tspan><tspan x="112" dy="28">안내</tspan></text><path d="M112 333v17m-5-5 5 5 5-5" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="354" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="402" font-size="20" fill="#393344"><tspan x="112" dy="0">다음 경로 직접</tspan><tspan x="112" dy="28">찾기</tspan></text><text text-anchor="middle" x="308" y="28" font-size="17" fill="#7952a7"><tspan x="308" dy="0">개선 제안</tspan></text><rect x="216" y="80" width="184" height="108" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="308" y="128" font-size="20" fill="#393344"><tspan x="308" dy="0">이용 가능한 혜택</tspan><tspan x="308" dy="28">안내</tspan></text><path d="M308 196v17m-5-5 5 5 5-5" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="216" y="217" width="184" height="108" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="308" y="279" font-size="20" fill="#393344"><tspan x="308" dy="0">웹 가입 바로가기</tspan></text><path d="M308 333v17m-5-5 5 5 5-5" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="216" y="354" width="184" height="108" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="308" y="402" font-size="20" fill="#393344"><tspan x="308" dy="0">가입 후 콘텐츠</tspan><tspan x="308" dy="28">이용</tspan></text></g></svg>
