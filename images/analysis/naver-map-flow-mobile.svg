<svg xmlns="http://www.w3.org/2000/svg" width="420" height="490" viewBox="0 0 420 490" role="img" aria-labelledby="title desc"><title id="title">같은 리스트, 다른 두 사용자의 흐름</title><desc id="desc">리스트 소유자: 장소를 리스트에 저장 → 공개 범위·내용 관리 → 리스트 링크 공유. 리스트 팔로워: 공유 리스트 열람 → 장소 확인·리스트 저장 → 이후 탐색에 활용</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text text-anchor="middle" x="112" y="28" font-size="17" fill="#706978"><tspan x="112" dy="0">리스트 소유자</tspan></text><rect x="20" y="80" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="128" font-size="20" fill="#393344"><tspan x="112" dy="0">장소를 리스트에</tspan><tspan x="112" dy="28">저장</tspan></text><path d="M112 196v17m-5-5 5 5 5-5" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="217" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="265" font-size="20" fill="#393344"><tspan x="112" dy="0">공개 범위·내용</tspan><tspan x="112" dy="28">관리</tspan></text><path d="M112 333v17m-5-5 5 5 5-5" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="354" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="416" font-size="20" fill="#393344"><tspan x="112" dy="0">리스트 링크 공유</tspan></text><text text-anchor="middle" x="308" y="28" font-size="17" fill="#7952a7"><tspan x="308" dy="0">리스트 팔로워</tspan></text><rect x="216" y="80" width="184" height="108" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="308" y="142" font-size="20" fill="#393344"><tspan x="308" dy="0">공유 리스트 열람</tspan></text><path d="M308 196v17m-5-5 5 5 5-5" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="216" y="217" width="184" height="108" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="308" y="265" font-size="20" fill="#393344"><tspan x="308" dy="0">장소 확인·리스트</tspan><tspan x="308" dy="28">저장</tspan></text><path d="M308 333v17m-5-5 5 5 5-5" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="216" y="354" width="184" height="108" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="308" y="416" font-size="20" fill="#393344"><tspan x="308" dy="0">이후 탐색에 활용</tspan></text></g></svg>
