<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">배송지 확인을 상품 탐색 앞으로</title><desc id="desc">기존 순서 · 원문 기준: 상품 탐색 → 주문 단계 진입 → 배송지·가능 여부 확인. 관찰한 개선 흐름: 배송지 확인·설정 → 지역에 맞는 상품 탐색 → 배송지 재확인 후 주문</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="25" y="30" font-size="19" font-weight="600" fill="#706978">기존 순서 · 원문 기준</text><rect x="24" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="170" y="110" font-size="23" fill="#393344"><tspan x="170" dy="0">상품 탐색</tspan></text><path d="M325 102h20m-6-6 6 6-6 6" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="354" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="500" y="110" font-size="23" fill="#393344"><tspan x="500" dy="0">주문 단계 진입</tspan></text><path d="M655 102h20m-6-6 6 6-6 6" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="684" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="830" y="110" font-size="23" fill="#393344"><tspan x="830" dy="0">배송지·가능 여부 확인</tspan></text><text x="25" y="195" font-size="19" font-weight="600" fill="#7952a7">관찰한 개선 흐름</text><rect x="24" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="170" y="275" font-size="23" fill="#393344"><tspan x="170" dy="0">배송지 확인·설정</tspan></text><path d="M325 267h20m-6-6 6 6-6 6" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="354" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="500" y="275" font-size="23" fill="#393344"><tspan x="500" dy="0">지역에 맞는 상품 탐색</tspan></text><path d="M655 267h20m-6-6 6 6-6 6" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="684" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="830" y="275" font-size="23" fill="#393344"><tspan x="830" dy="0">배송지 재확인 후 주문</tspan></text></g></svg>
