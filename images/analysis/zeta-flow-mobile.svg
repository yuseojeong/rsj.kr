<svg xmlns="http://www.w3.org/2000/svg" width="420" height="490" viewBox="0 0 420 490" role="img" aria-labelledby="title desc"><title id="title">말투 예시와 대화 기억의 역할 분리</title><desc id="desc">표현 방식 · Few-shot: 주제·상황·감정 파악 → 관련 대화 예시 선택 → 캐릭터 말투로 응답. 기억할 정보 · RAG: 현재 질문의 맥락 파악 → 관련 과거 기록 검색 → 기억을 반영해 응답</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text text-anchor="middle" x="112" y="28" font-size="17" fill="#706978"><tspan x="112" dy="0">표현 방식 ·</tspan><tspan x="112" dy="23.799999999999997">Few-shot</tspan></text><rect x="20" y="80" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="128" font-size="20" fill="#393344"><tspan x="112" dy="0">주제·상황·감정</tspan><tspan x="112" dy="28">파악</tspan></text><path d="M112 196v17m-5-5 5 5 5-5" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="217" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="265" font-size="20" fill="#393344"><tspan x="112" dy="0">관련 대화 예시</tspan><tspan x="112" dy="28">선택</tspan></text><path d="M112 333v17m-5-5 5 5 5-5" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="354" width="184" height="108" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="112" y="402" font-size="20" fill="#393344"><tspan x="112" dy="0">캐릭터 말투로</tspan><tspan x="112" dy="28">응답</tspan></text><text text-anchor="middle" x="308" y="28" font-size="17" fill="#7952a7"><tspan x="308" dy="0">기억할 정보 · RAG</tspan></text><rect x="216" y="80" width="184" height="108" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="308" y="128" font-size="20" fill="#393344"><tspan x="308" dy="0">현재 질문의 맥락</tspan><tspan x="308" dy="28">파악</tspan></text><path d="M308 196v17m-5-5 5 5 5-5" fill="none" stroke="#7952a7" stroke-width="2" str