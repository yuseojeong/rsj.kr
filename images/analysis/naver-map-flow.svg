<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">같은 리스트, 다른 두 사용자의 흐름</title><desc id="desc">리스트 소유자: 장소를 리스트에 저장 → 공개 범위·내용 관리 → 리스트 링크 공유. 리스트 팔로워: 공유 리스트 열람 → 장소 확인·리스트 저장 → 이후 탐색에 활용</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="25" y="30" font-size="19" font-weight="600" fill="#706978">리스트 소유자</text><rect x="24" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="170" y="110" font-size="23" fill="#393344"><tspan x="170" dy="0">장소를 리스트에 저장</tspan></text><path d="M325 102h20m-6-6 6 6-6 6" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="354" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="500" y="110" font-size="23" fill="#393344"><tspan x="500" dy="0">공개 범위·내용 관리</tspan></text><path d="M655 102h20m-6-6 6 6-6 6" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="684" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="830" y="110" font-size="23" fill="#393344"><tspan x="830" dy="0">리스트 링크 공유</tspan></text><text x="25" y="195" font-size="19" font-weight="600" fill="#7952a7">리스트 팔로워</text><rect x="24" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="170" y="275" font-size="23" fill="#393344"><tspan x="170" dy="0">공유 리스트 열람</tspan></text><path d="M325 267h20m-6-6 6 6-6 6" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="354" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="500" y="275" font-size="23" fill="#393344"><tspan x="500" dy="0">장소 확인·리스트 저장</tspan></text><path d="M655 267h20m-6-6 6 6-6 6" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="684" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="830" y="275" font-size="23" fill="#393344"><tspan x="830" dy="0">이후 탐색에 활용</tspan></text></g></svg>
