<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">곡을 하나씩 담는 반복을 줄이는 제안</title><desc id="desc">관찰한 흐름: 추천 목록에서 곡 찾기 → 한 곡씩 저장 → 다음 곡마다 반복. 개선 제안: 추천 목록 열기 → 원하는 여러 곡 선택 → 내 목록에 함께 저장</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="25" y="30" font-size="19" font-weight="600" fill="#706978">관찰한 흐름</text><rect x="24" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="170" y="110" font-size="23" fill="#393344"><tspan x="170" dy="0">추천 목록에서 곡 찾기</tspan></text><path d="M325 102h20m-6-6 6 6-6 6" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="354" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="500" y="110" font-size="23" fill="#393344"><tspan x="500" dy="0">한 곡씩 저장</tspan></text><path d="M655 102h20m-6-6 6 6-6 6" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="684" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="830" y="110" font-size="23" fill="#393344"><tspan x="830" dy="0">다음 곡마다 반복</tspan></text><text x="25" y="195" font-size="19" font-weight="600" fill="#7952a7">개선 제안</text><rect x="24" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="170" y="275" font-size="23" fill="#393344"><tspan x="170" dy="0">추천 목록 열기</tspan></text><path d="M325 267h20m-6-6 6 6-6 6" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="354" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="500" y="275" font-size="23" fill="#393344"><tspan x="500" dy="0">원하는 여러 곡 선택</tspan></text><path d="M655 267h20m-6-6 6 6-6 6" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="684" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="830" y="275" font-size="23" fill="#393344"><tspan x="830" dy="0">내 목록에 함께 저장</tspan></text></g></svg>
