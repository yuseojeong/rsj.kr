<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">말투 예시와 대화 기억의 역할 분리</title><desc id="desc">표현 방식 · Few-shot: 주제·상황·감정 파악 → 관련 대화 예시 선택 → 캐릭터 말투로 응답. 기억할 정보 · RAG: 현재 질문의 맥락 파악 → 관련 과거 기록 검색 → 기억을 반영해 응답</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif"><text x="25" y="30" font-size="19" font-weight="600" fill="#706978">표현 방식 · Few-shot</text><rect x="24" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="170" y="110" font-size="23" fill="#393344"><tspan x="170" dy="0">주제·상황·감정 파악</tspan></text><path d="M325 102h20m-6-6 6 6-6 6" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="354" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="500" y="110" font-size="23" fill="#393344"><tspan x="500" dy="0">관련 대화 예시 선택</tspan></text><path d="M655 102h20m-6-6 6 6-6 6" fill="none" stroke="#706978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="684" y="50" width="292" height="104" rx="14" fill="#f4f2f6" stroke="#e3dfe8"/><text text-anchor="middle" x="830" y="110" font-size="23" fill="#393344"><tspan x="830" dy="0">캐릭터 말투로 응답</tspan></text><text x="25" y="195" font-size="19" font-weight="600" fill="#7952a7">기억할 정보 · RAG</text><rect x="24" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="170" y="275" font-size="23" fill="#393344"><tspan x="170" dy="0">현재 질문의 맥락 파악</tspan></text><path d="M325 267h20m-6-6 6 6-6 6" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="354" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="500" y="275" font-size="23" fill="#393344"><tspan x="500" dy="0">관련 과거 기록 검색</tspan></text><path d="M655 267h20m-6-6 6 6-6 6" fill="none" stroke="#7952a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="684" y="215" width="292" height="104" rx="14" fill="#f4effb" stroke="#d8c8e9"/><text text-anchor="middle" x="830" y="275" font-size="23" fill="#393344"><tspan x="830" dy="0">기억을 반영해 응답</tspan></text></g></svg>
